
name: monolithtomicro-day5

services:
  product-api:
    build:
      context: .
      dockerfile: src/MonolithToMicro.Product.Api/Dockerfile
    ports:
      - "127.0.0.1:6102:8080"
    env_file:
      - .env.product.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    restart: unless-stopped

  order-api:
    build:
      context: .
      dockerfile: src/MonolithToMicro.Order.Api/Dockerfile
    ports:
      - "127.0.0.1:6103:8080"
    env_file:
      - .env.order.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ProductApi__BaseUrl: http://product-api:8080/
    depends_on:
      - product-api
    restart: unless-stopped
