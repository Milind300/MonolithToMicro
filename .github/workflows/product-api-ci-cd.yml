
name: Product API - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/MonolithToMicro.Product.Api/**'
      - 'tests/MonolithToMicro.Product.Tests/**'
      - '.github/workflows/product-api-ci-cd.yml'
      - 'Directory.Build.props'
      - 'MonolithToMicro.slnx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-api-production
  cancel-in-progress: false

env:
  PROJECT_PATH: src/MonolithToMicro.Product.Api/MonolithToMicro.Product.Api.csproj
  TEST_PATH: tests/MonolithToMicro.Order.Tests/MonolithToMicro.Order.Tests.csproj
  WEBAPP_NAME: app-monolithtomicro-product-day6
  BASE_URL: https://app-monolithtomicro-product-day6-hphkbuaacch3ace8.centralindia-01.azurewebsites.net

jobs:
  build:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Product API
        run: dotnet restore "$PROJECT_PATH"

      - name: Build Product API
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Run existing automated tests
        run: dotnet test "$TEST_PATH" --configuration Release

      - name: Publish Product API
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-restore --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-api
          path: ./publish/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: product-api
          path: ./publish

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Product API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: ./publish

      - name: Verify deployed endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in /health /api/product; do
            echo "Checking $endpoint"
            curl --fail --show-error --silent \
              --retry 6 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output /dev/null \
              "$BASE_URL$endpoint"
            echo "$endpoint: PASS"
          done
