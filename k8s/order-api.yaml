apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: monolithtomicro
spec:
  replicas: 1
  selector: {matchLabels: {app: order-api}}
  template:
    metadata: {labels: {app: order-api}}
    spec:
      containers:
        - name: order-api
          image: monolithtomicro-day5-order-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: ProductApi__BaseUrl
              value: http://product-api:8080/
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
